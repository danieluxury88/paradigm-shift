<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paradigm Shift</title>
    <!-- Rust emits modern WASM features (bulk memory, reference types...) that every current browser supports; wasm-opt must be told to accept them. -->
    <link data-trunk rel="rust" data-wasm-opt="s" data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue">
    <style>
      html, body { margin: 0; height: 100%; background: #15171c; }
      canvas { display: block; width: 100%; height: 100%; outline: none; }
    </style>
  </head>
  <body>
    <canvas id="bevy" tabindex="0"></canvas>
  </body>
</html>
